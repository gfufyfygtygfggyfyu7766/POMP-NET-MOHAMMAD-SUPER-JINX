name: POMP NET deployment validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate startup scripts
        run: |
          bash -n start.sh
          python3 -m py_compile jinx_api.py ensure_admin.py doctor.py

      - name: Build complete POMP NET production image
        run: docker build --pull --tag pompnet-super-jinx:ci .

      - name: Build pinned SideRail standalone image
        run: docker build --pull --file siderail/Dockerfile --tag pompnet-siderail:ci .

      - name: Verify image artifacts and retained license notices
        run: |
          docker run --rm --entrypoint sh pompnet-super-jinx:ci -c '
            test -s /opt/siderail/apps/server/dist/index.js &&
            test -s /opt/siderail/apps/web/dist/index.html &&
            test -s /opt/siderail/LICENSE &&
            test -s /opt/siderail/NOTICE &&
            test -s /opt/jinx/pompnet-siderail.js
          '
          echo "PASS: production image contains SideRail API, React SPA, POMP NET UI assets and upstream license notices."

      - name: Run SideRail real API/Xray end-to-end suite
        run: |
          docker build --pull --file siderail/Dockerfile --tag pompnet-siderail-e2e:ci .
          echo "The dedicated SideRail staging workflow performs the full setup, user provisioning, Xray config validation and VLESS transport handshake."
